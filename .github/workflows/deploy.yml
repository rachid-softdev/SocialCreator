name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "9.15.9"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter=socialcreator-web exec prisma generate

      - name: Build Next.js application
        run: pnpm run build
        env:
          # Build-time only values: the production runtime env is configured
          # inside Vercel itself. Fallbacks keep the workflow green even
          # before secrets are configured in this repository.
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-build-fallback-auth-secret-0123456789abcdef' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'ci-build-fallback-encryption-key-0123456789abcdef' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || 'ci-build-fallback-client-id' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || 'ci-build-fallback-client-secret' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/socialcreator_build' }}

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build]
    # secrets are not allowed in step-level OR job-level if conditions, so
    # gate on a repo variable instead (set DEPLOY_ENABLED=true in repo
    # settings once VERCEL_TOKEN/ORG/PROJECT secrets are configured).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
